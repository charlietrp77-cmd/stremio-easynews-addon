services:
  stremio-easynews-addon:
    build:
      context: .
      dockerfile: Dockerfile
    image: stremio-easynews-addon:latest
    container_name: stremio-easynews-addon
    restart: unless-stopped
    expose:
      - "1337"
    environment:
      - PORT=1337

      # =========================================================================
      # 1. YOUR EASYNEWS ACCOUNT CREDENTIALS:
      # =========================================================================
      - EASYNEWS_USERNAME=your_username_here
      - EASYNEWS_PASSWORD=your_password_here

      # =========================================================================
      # 2. YOUR DUCKDNS DOMAIN (REPLACE WITH YOUR SUBDOMAIN):
      # =========================================================================
      - PROXY_URL=https://${DUCKDNS_DOMAIN:-yoursubdomain.duckdns.org}

      # 4K Remux Multi-Connection Tuning
      - CONCURRENT_CHUNKS=4       # 4 to 8 parallel range streams to Easynews CDN
      - CHUNK_SIZE_MB=4           # 4 MB chunk size
      - MAX_BUFFER_CHUNKS=12      # ~48 MB RAM buffer window
      - ENABLE_LOCAL_PROXY=true
      - ENABLE_MULTI_CHUNK=true

  # =============================================================================
  # CADDY (WITH DUCKDNS DNS-01 CHALLENGE):
  # Obtains a 100% valid, trusted HTTPS SSL certificate WITHOUT opening any
  # ports on your router!
  # =============================================================================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: caddy-duckdns:latest
    container_name: caddy-easynews-ssl
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-yoursubdomain.duckdns.org}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-your_duckdns_token_here}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
