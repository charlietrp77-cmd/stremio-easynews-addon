services:
  stremio-easynews-addon:
    build:
      context: .
      dockerfile: Dockerfile
    image: stremio-easynews-addon:latest
    container_name: stremio-easynews-addon
    restart: unless-stopped
    expose:
      - "1337"
    environment:
      - PORT=1337

      # =========================================================================
      # EASYNEWS CREDENTIALS (NO URL SETUP NEEDED!):
      # =========================================================================
      - EASYNEWS_USERNAME=your_username_here
      - EASYNEWS_PASSWORD=your_password_here

      # =========================================================================
      # PUBLIC HTTPS PROXY URL (HANDLED BY CADDY):
      # Set this to your domain (e.g. https://easynews.yourdomain.com)
      # =========================================================================
      - PROXY_URL=https://${DOMAIN_NAME:-easynews.yourdomain.com}

      # Streaming Performance & Multi-Connection Tuning (Phases 2 & 3)
      - CONCURRENT_CHUNKS=4       # Parallel connections to CDN (4 to 8 recommended for 4K Remux)
      - CHUNK_SIZE_MB=4           # Size of each chunk in megabytes (default 4 MB)
      - MAX_BUFFER_CHUNKS=12      # In-memory sliding buffer size (~48 MB RAM)
      - ENABLE_LOCAL_PROXY=true   # JIT redirect resolution & local proxying
      - ENABLE_MULTI_CHUNK=true   # Multi-connection range streaming for high bitrates

  # =============================================================================
  # CADDY: AUTOMATIC ZERO-CONFIG HTTPS REVERSE PROXY
  # Obtains and auto-renews free trusted SSL certificates from Let's Encrypt
  # =============================================================================
  caddy:
    image: caddy:alpine
    container_name: caddy-easynews-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-easynews.yourdomain.com}
    command: caddy reverse-proxy --from ${DOMAIN_NAME:-easynews.yourdomain.com} --to stremio-easynews-addon:1337
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
